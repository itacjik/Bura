<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="140" height="190" viewBox="0 0 140 190">
    <!-- Card background -->
    <rect x="5" y="5" width="130" height="180" rx="10" ry="10" fill="white" stroke="black" stroke-width="1"/>
    
    <!-- Card content will be placed here -->
    <g id="card-content">
        <!-- Top rank and suit -->
        <text id="top-rank" x="15" y="35" font-family="Arial" font-size="24" fill="#000000">A</text>
        <text id="top-suit" x="15" y="60" font-family="Arial" font-size="24" fill="#000000">♠</text>
        
        <!-- Center suit -->
        <text id="center-suit" x="70" y="95" font-family="Arial" font-size="60" fill="#000000" text-anchor="middle">♠</text>
        
        <!-- Bottom rank and suit -->
        <text id="bottom-rank" x="125" y="155" font-family="Arial" font-size="24" fill="#000000">A</text>
        <text id="bottom-suit" x="125" y="180" font-family="Arial" font-size="24" fill="#000000">♠</text>
    </g>
</svg>
